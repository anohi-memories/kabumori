# Phase 2 (deploy preview pipeline): still not used to create or configure any Netlify site --
# creating a site requires interactive Netlify account authorization this task cannot perform (per this
# task's production mutation budget of 0). See ../docs/phase1-netlify-thin-control-plane.md (Phase 1
# readiness audit) and ../docs/phase2-netlify-deploy-preview.md (this file's setup runbook + verified
# Next.js 16 support + the one remaining risk that needs a live Deploy Preview) for the full picture.
#
# Setup once a site exists: connect this repository with "Base directory" set to "apps/admin" in the
# Netlify UI (this repo has no root-level workspace tooling -- apps/admin is a self-contained Next.js app
# with its own package.json/lockfile, the same way it is deployed to Vercel today). Netlify auto-detects
# netlify.toml at the configured Base directory, so no root-level file is needed. Base directory also
# scopes build triggers: only pushes/PRs touching apps/admin/** build this site. The current Vercel
# Production deployment is untouched by this file's existence; adding/editing it does not by itself
# create, modify, or deploy anything.
[build]
  command = "npm run build"
  publish = ".next"

# Netlify's own Next.js Runtime (bundled automatically for detected Next.js sites, not pinned here on
# purpose -- Netlify recommends leaving the adapter version unpinned so each build picks up its latest
# compatibility fixes) reads the build output above and provisions the necessary Netlify Functions for
# SSR/Server Actions/the proxy itself -- no explicit @netlify/plugin-nextjs entry is needed.
#
# Next.js 16 is officially supported by Netlify with zero required configuration (confirmed via Netlify's
# own changelog; this app's 16.3.4 is also past the 16.3.3 minimum a 2026-08 Netlify security advisory
# recommended). The one remaining, NOT locally verifiable risk: this app uses `src/proxy.ts` (Next.js 16's
# rename of middleware.ts). Community reports as of this writing describe proxy.ts support depending on
# the exact bundled adapter version and recommend confirming the request that runs through it (session
# cookie refresh, in this app's case) actually fires on a real Netlify Deploy Preview before relying on
# it in production -- see docs/phase2-netlify-deploy-preview.md "Netlify readiness (Phase 2)" for detail
# and citations. Everything else in this app (no service-role key, no Node-only APIs outside the one
# Server Action, standard cookies-based @supabase/ssr session handling) is already compatible with how
# Netlify's Next.js Runtime works.

[build.environment]
  NODE_VERSION = "24"

# Public, non-secret values only (the anon/publishable Supabase key is meant to ship in the client bundle
# -- see apps/admin/src/lib/supabase/env.ts). Never add SUPABASE_SERVICE_ROLE_KEY, X_CLIENT_SECRET,
# OPENAI_API_KEY, or any other server secret here or in the Netlify UI's environment variables for this
# site: this app's source has no code path that would even read such a variable today, and it must stay
# that way for Netlify to remain a thin, secret-free authenticated UI as this task's Goal requires.
#
# Uncomment locally in the Netlify UI (do not hardcode real values in this file, even though they are not
# secret, so the same file can be reused across environments without editing):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY

name: Sync AI Lab diary snapshot

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/_shared/brand/ai_lab_dev_diary_context.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-lab-diary-snapshot-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate canonical diary before generation
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import {
            isValidCalendarDate,
            parseDevDiaryMarkdown,
            sanitizeDiaryEntry,
          } from "./supabase/functions/_shared/brand/ai_lab_dev_diary_context.ts";

          const path = "supabase/functions/_shared/brand/ai_lab_dev_diary_context.md";
          const markdown = await readFile(path, "utf8");
          const entries = parseDevDiaryMarkdown(markdown);

          if (entries.length === 0) {
            throw new Error("AI Lab diary must contain at least one valid entry");
          }

          const jstToday = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Tokyo",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          }).format(new Date());

          const seenDates = new Set();
          for (const entry of entries) {
            if (!isValidCalendarDate(entry.date)) {
              throw new Error(`Invalid diary date: ${entry.date}`);
            }
            if (entry.date > jstToday) {
              throw new Error(`Future diary date is not allowed: ${entry.date} > ${jstToday}`);
            }
            if (seenDates.has(entry.date)) {
              throw new Error(`Duplicate diary date: ${entry.date}`);
            }
            seenDates.add(entry.date);

            const sanitized = sanitizeDiaryEntry(entry);
            if (!sanitized) {
              throw new Error(`Unsafe diary entry rejected: ${entry.date}`);
            }
            if (JSON.stringify(sanitized) !== JSON.stringify(entry)) {
              throw new Error(`Diary entry would be altered by sanitizer: ${entry.date}`);
            }
          }

          console.log(`Validated ${entries.length} public-safe diary entries through ${jstToday} JST.`);
          NODE

      - name: Regenerate runtime snapshot
        run: |
          node --experimental-strip-types             supabase/functions/_shared/brand/generate_ai_lab_dev_diary_snapshot.ts

      - name: Run parity, freshness, sanitizer, and generator regression tests
        run: |
          node --experimental-strip-types --test             supabase/functions/_shared/brand/ai_lab_dev_diary_context_test.ts             supabase/functions/_shared/brand/brand_profiles_test.ts             supabase/functions/_shared/brand/brand_post_generator_test.ts

      - name: Enforce generated-file-only diff
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="supabase/functions/_shared/brand/ai_lab_dev_diary_context.snapshot.ts"

          unexpected="$(
            git status --porcelain |
            awk '{print $2}' |
            grep -v -F "$SNAPSHOT" || true
          )"

          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files changed by diary synchronization:"
            echo "$unexpected"
            exit 1
          fi

          if git diff --quiet -- "$SNAPSHOT"; then
            echo "Snapshot is already synchronized; nothing to commit."
          else
            echo "Snapshot regeneration produced the expected deterministic diff."
          fi

      - name: Race check and commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="supabase/functions/_shared/brand/ai_lab_dev_diary_context.snapshot.ts"

          if git diff --quiet -- "$SNAPSHOT"; then
            exit 0
          fi

          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"

          if [[ "$local_sha" != "$remote_sha" ]]; then
            echo "main advanced while this workflow was running; refusing a non-fast-forward snapshot write."
            echo "Re-run this workflow on the latest main after the newer commit settles."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$SNAPSHOT"
          git commit -m "chore: sync AI Lab diary snapshot"
          git push origin HEAD:main

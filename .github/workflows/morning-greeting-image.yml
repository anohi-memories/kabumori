name: Generate morning greeting image

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "JST date (YYYY-MM-DD); blank uses today's JST date"
        required: false
        type: string
  schedule:
    # GitHub creates scheduled runs late (hours, since 2026-09-20) or occasionally not at all, so a single
    # 05:30 JST trigger regularly missed the ~06:30-07:00 JST morning greeting post. Several staggered,
    # off-the-hour wake-ups each get a chance to create the day's image; whichever runs first generates it
    # and every later run finds generated/<date>.png already in Storage and skips without calling OpenAI.
    # A run that failed (e.g. OpenAI 429) is retried by the next wake-up.
    #
    # All four fire after JST midnight (JST = UTC+9), so the script's resolveJstDate() -- target_date is
    # intentionally left unset for scheduled runs -- lands on the posting day even when a run is delayed:
    #   15:17 UTC = 00:17 JST
    #   17:47 UTC = 02:47 JST
    #   19:17 UTC = 04:17 JST
    #   20:17 UTC = 05:17 JST (last chance, >= 60 min before the 06:30 JST window start)
    - cron: "17 15 * * *"
    - cron: "47 17 * * *"
    - cron: "17 19 * * *"
    - cron: "17 20 * * *"

permissions:
  contents: read

# Serializes overlapping wake-ups (e.g. delayed runs created close together): a queued run starts only
# after the running one finishes, then sees the stored image and skips. Never cancels a running generation.
concurrency:
  group: morning-greeting-image
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate and store one image
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MORNING_GREETING_DATE: ${{ inputs.target_date }}
        run: node --experimental-strip-types scripts/morning-greeting-image.ts

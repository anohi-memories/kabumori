name: Generate morning greeting image

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "JST date (YYYY-MM-DD); blank uses today's JST date"
        required: false
        type: string
  schedule:
    # 20:30 UTC = 05:30 JST the following day (JST = UTC+9), well ahead of the ~06:30-07:00 JST morning
    # greeting post. target_date is intentionally left unset here (see the "Generate and store one image"
    # step below): the script resolves the JST calendar date at the moment it actually runs
    # (resolveJstDate() in scripts/morning-greeting-image.ts), not the UTC date GitHub's scheduler used to
    # fire the job — so this always targets the correct JST day regardless of that UTC/JST offset.
    - cron: "30 20 * * *"

permissions:
  contents: read

concurrency:
  group: morning-greeting-image
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate and store one image
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MORNING_GREETING_DATE: ${{ inputs.target_date }}
        run: node --experimental-strip-types scripts/morning-greeting-image.ts
